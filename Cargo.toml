[package]
name = "mailout"
version = "0.1.0"
edition = "2021"
authors = ["MailOut Contributors"]
description = "Find work emails from LinkedIn profiles using public web data"
license = "MIT"
repository = "https://github.com/abinesha312/mailout"
keywords = ["email", "linkedin", "scraper", "b2b"]

[[bin]]
name = "mailout"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.40", features = ["full"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
axum = { version = "0.7", features = ["json", "macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Parsing
scraper = "0.20"
regex = "1.10"
url = "2.5"

# Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Utils
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
home = "0.5.9"
urlencoding = "2.1"

[dev-dependencies]
mockito = "1.5"
tempfile = "3.12"
